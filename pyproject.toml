[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tennis-prediction"
version = "0.1.0"
description = "Local tennis simulation and ATP pool decision support"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "requests>=2.32.4,<3",
    "aiohttp>=3.12,<4",
    "python-dateutil>=2.9,<3",
]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
ml = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "joblib>=1.4,<2",
    "scikit-learn>=1.5,<2",
    "xgboost>=2.1,<4",
]
excel = ["openpyxl>=3.1,<4"]
web = ["Flask>=3.1,<4"]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=1.0,<2",
    "build>=1.2,<2",
    "ruff>=0.15,<0.16",
    "mypy>=1.19,<2",
    "pip-audit>=2.9,<3",
]

[tool.setuptools.packages.find]
include = ["tennis_api*", "tennis_pool*", "tennis_preds*", "web_interface*"]
exclude = ["*.tests*"]

[tool.setuptools.package-data]
tennis_pool = ["*.json"]
web_interface = ["*.html", "*.js", "*.css"]

[tool.uv]
required-version = "==0.12.23"

[tool.ruff]
target-version = "py311"
extend-exclude = ["2023", "2024", "build", "dist", ".kilo", ".kilocode"]

[tool.ruff.lint]
# Establish fatal syntax/control-flow checks without a legacy style rewrite.
select = ["E9", "F63", "F7", "F82", "F821"]

[tool.mypy]
python_version = "3.11"
files = ["tennis_pool", "pool_optimizer/pool/scoring.py"]
strict = true
warn_unused_ignores = true
exclude = ["/tests/"]
